name: Release

on:
  push:
    tags: ['v*']
  # Manual run validates the packages without publishing a release.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('0.0.0-test.{0}', github.run_number) || github.ref_name }}

jobs:
  # GNOME/KDE Wayland engine: libei >= 1.1 first ships in Ubuntu 24.04, so this plugin needs
  # glibc >= 2.39. It is only loaded on portal sessions; X11 and wlroots hosts never open it.
  portal-plugin:
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxext-dev libxtst-dev libxfixes-dev libglib2.0-dev libpipewire-0.3-dev libei-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: UU_NO_GTK=1 cargo build --release --locked --features portal,engine-plugins --bin uuremote-server
      - uses: actions/upload-artifact@v5
        with:
          name: libuu-portal-${{ matrix.arch }}
          path: target/release/libuu-portal.so

  build:
    needs: portal-plugin
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    # Built on 22.04 so the binary also runs on Ubuntu 22.04/24.04 and newer Debian (glibc >= 2.35).
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxext-dev libxtst-dev libxfixes-dev libgtk-3-dev libsdl2-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked
      # One package for every desktop: Wayland (wlroots) and GNOME/KDE portal engines are plugins
      # opened at runtime (engine-plugins), so X11 hosts need none of their libraries.
      - run: cargo build --release --locked --features wayland,portal,engine-plugins
      - uses: actions/download-artifact@v8
        with:
          name: libuu-portal-${{ matrix.arch }}
          path: target/release
      # Experimental viewer; built after the host so uuremote-server keeps the release features.
      - run: cargo build --release --locked --features native-viewer,viewer-sdl --bin uuremote-viewer
      - name: Package
        run: |
          name=uu-remote-linux-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux
          mkdir -p "$name"
          cp target/release/uuremote-server target/release/uuremote-viewer target/release/libuu-wayland.so target/release/libuu-portal.so \
            packaging/tarball/install.sh LICENSE README.md README.en.md config.example.json "$name/"
          cp -r contrib "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Debian package
        run: |
          packaging/deb/build-deb.sh "${PACKAGE_VERSION#v}" target/release .
          deb=$(ls uu-remote-linux_*.deb)
          sha256sum "$deb" > "$deb.sha256"
          sudo apt-get install -y "./$deb"
          uuremote-server --help | head -1
          systemd-analyze verify /usr/lib/systemd/user/uuremote-native.service
      - uses: actions/upload-artifact@v5
        with:
          name: package-${{ matrix.arch }}
          path: |
            uu-remote-linux-*.tar.gz*
            uu-remote-linux_*.deb*
          if-no-files-found: error

  # LoongArch ABI 2.0 packages: build once under QEMU, then emit both userland arch names.
  # The Debian loong64 container supplies the runtime libraries; the loongarch64 package is the
  # same binary with AOSC's dpkg architecture so both worlds can install it.
  build-loongarch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - name: Build and package in LoongArch QEMU
        run: |
          docker run --rm -i \
            --platform linux/loong64 \
            -v "$PWD:/src" \
            -w /src \
            -e GITHUB_REF_NAME \
            -e PACKAGE_VERSION \
            ghcr.io/loong64/debian:trixie \
            bash -s <<'EOF'
            set -euxo pipefail
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential dpkg-dev pkg-config ca-certificates curl git \
              libx11-dev libxext-dev libxtst-dev libxfixes-dev libgtk-3-dev libsdl2-dev \
              libwayland-dev libwayland-bin libxkbcommon-dev \
              libglib2.0-dev libpipewire-0.3-dev libei-dev
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            cargo build --release --locked --features wayland,portal,engine-plugins
            cargo build --release --locked --features native-viewer,viewer-sdl --bin uuremote-viewer

            test "$(dpkg --print-architecture)" = loong64
            version="${PACKAGE_VERSION#v}"
            packaging/deb/build-deb.sh "$version" target/release .
            deb_native="uu-remote-linux_${version}_loong64.deb"
            deb_alt="uu-remote-linux_${version}_loongarch64.deb"
            work=$(mktemp -d)
            dpkg-deb -R "$deb_native" "$work/pkg"
            sed -i 's/^Architecture: .*/Architecture: loongarch64/' "$work/pkg/DEBIAN/control"
            dpkg-deb --build --root-owner-group "$work/pkg" "$deb_alt"
            rm -rf "$work"
            test "$(dpkg-deb -f "$deb_alt" Architecture)" = loongarch64

            for arch in loong64 loongarch64; do
              name="uu-remote-linux-${GITHUB_REF_NAME}-${arch}-linux"
              mkdir -p "$name"
              cp target/release/uuremote-server target/release/uuremote-viewer \
                target/release/libuu-wayland.so target/release/libuu-portal.so \
                packaging/tarball/install.sh LICENSE README.md README.en.md config.example.json "$name/"
              cp -r contrib "$name/"
              tar czf "$name.tar.gz" "$name"
              sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
            done
            sha256sum "$deb_native" > "$deb_native.sha256"
            sha256sum "$deb_alt" > "$deb_alt.sha256"
          EOF
      - uses: actions/upload-artifact@v5
        with:
          name: package-loongarch
          path: |
            uu-remote-linux-*.tar.gz*
            uu-remote-linux_*.deb*
          if-no-files-found: error

  # One publisher, so the matrix legs never race to create the release.
  release:
    needs: [build, build-loongarch]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
      - name: Verify packages
        run: ls -lh uu-remote-linux_*.deb uu-remote-linux-*.tar.gz
      - uses: softprops/action-gh-release@v3
        with:
          body_path: docs/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            uu-remote-linux-*.tar.gz
            uu-remote-linux-*.tar.gz.sha256
            uu-remote-linux_*.deb
            uu-remote-linux_*.deb.sha256

  # Headless NAS image (docker/), built from the release tarball published by the job above.
  # Pushes to the current repository's GHCR namespace (ghcr.io/<owner>/uu-remote-linux).
  docker:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/uu-remote-linux:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/uu-remote-linux:latest
