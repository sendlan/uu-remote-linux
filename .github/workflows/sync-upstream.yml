name: Sync upstream

# 每天跟踪上游（VallierDev/uu-remote-linux）最新 release：
# 有新版本时 merge 进 main、bump 版本号、生成 release notes、
# 打同名 tag，再通过 workflow_dispatch 直接触发 Release workflow
# 构建四架构包（GITHUB_TOKEN 的 tag push 事件不触发其他 workflow，
# 但 workflow_dispatch 豁免，因此无需 PAT/SYNC_TOKEN）。

on:
  schedule:
    - cron: '30 1 * * *' # UTC 01:30 = 北京时间 09:30
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: VallierDev/uu-remote-linux

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch upstream tags
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main --tags --force

      - name: Detect latest upstream release
        id: detect
        run: |
          # API 失败必须响亮报错：静默 skip 会让 fork 停在旧版本数天无人察觉。
          # 注意不要写 `UP_TAG=$(curl ... || {...} | jq)`：| 优先于 ||，
          # curl 成功时 jq 根本不执行，整个 JSON 会成为 UP_TAG。
          RESP=$(curl -sf "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest") \
            || { echo "::error::upstream releases API failed (rate-limited?)"; exit 1; }
          UP_TAG=$(printf '%s' "$RESP" | jq -r '.tag_name // empty')
          echo "up_tag=$UP_TAG" >> "$GITHUB_OUTPUT"
          # 已同步判定看提交是否已在 main 里，而不是 tag 是否存在——
          # fork 上可能残留指向上游提交的同名 tag（fetch upstream --tags 曾推上去过）
          if [ -z "$UP_TAG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "upstream has no releases"
          elif git merge-base --is-ancestor "${UP_TAG}^{commit}" main 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "already synced: $UP_TAG"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "new upstream release: $UP_TAG"
          fi

      - name: Merge upstream release
        id: merge
        if: steps.detect.outputs.skip == 'false'
        run: |
          TAG="${{ steps.detect.outputs.up_tag }}"
          git config user.name "upstream-sync bot"
          git config user.email "actions@users.noreply.github.com"

          if ! git merge --no-edit "$TAG"; then
            # 冲突自动处理：Cargo.*、docs/release-notes、vendor/ 一律取上游。
            # 用 checkout <TAG> 而非 --theirs，可正确处理 modify/delete 冲突。
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "conflicted files: $CONFLICTS"
            BAD=$(echo "$CONFLICTS" | grep -vE '^(Cargo\.toml|Cargo\.lock|docs/release-notes/|vendor/)' || true)
            if [ -n "$BAD" ]; then
              echo "::error::merge conflict beyond auto-resolvable files — manual resolution needed: $BAD"
              git merge --abort
              exit 1
            fi
            for f in $CONFLICTS; do
              case "$f" in
                vendor/*)
                  if git cat-file -e "$TAG:$f" 2>/dev/null; then
                    git checkout "$TAG" -- "$f"
                  else
                    git rm -q -- "$f"
                  fi ;;
                *) git checkout "$TAG" -- "$f" ;;
              esac
            done
            git add -A
            git -c core.editor=true merge --continue
          fi

          # vendor 目录无条件强制对齐上游（防跨基座文本自动合并出缝合树）。
          # vendor/nix-0.26 与 vendor/ring-0.16 是我们独有的 LoongArch 补件，
          # 上游不存在同名目录 —— 若列入强刷会先被 git rm 再跳过 checkout，
          # 直接把补件删掉，务必保持排除。
          for d in vendor/webrtc vendor/webrtc-ice vendor/webrtc-dtls vendor/webrtc-srtp vendor/ffnvcodec; do
            git rm -rqf "$d" 2>/dev/null || true
            if git cat-file -e "$TAG:$d" 2>/dev/null; then
              git checkout "$TAG" -- "$d"
            fi
          done
          git add -A
          git diff --cached --quiet || git -c core.editor=true commit --amend --no-edit
          echo "merged $TAG"

      - name: Reconcile Cargo manifest and lockfile
        if: steps.detect.outputs.skip == 'false'
        run: |
          TAG="${{ steps.detect.outputs.up_tag }}"
          # Cargo.toml / Cargo.lock 整体取上游（依赖布局以上游为唯一权威），
          # 仅回填 LoongArch 必需的补丁行（nix 0.26 / ring 0.16）。
          git checkout "$TAG" -- Cargo.toml Cargo.lock
          python3 - <<'EOF'
          p = 'Cargo.toml'
          s = open(p).read()
          lines = (
              '# LoongArch: nix 0.26 predates loongarch64; webrtc-util pins nix 0.26.\n'
              'nix = { path = "vendor/nix-0.26" }\n'
              '# LoongArch: ring 0.16.20 (via rcgen 0.11) has no loongarch64 asm; no-asm build.\n'
              'ring = { path = "vendor/ring-0.16" }\n'
          )
          if 'vendor/nix-0.26' not in s:
              s = s.replace('[patch.crates-io]\n', '[patch.crates-io]\n' + lines, 1)
              open(p, 'w').write(s)
              print('patched entries appended')
          else:
              print('patched entries already present')
          EOF

          # 依据对账后的 Cargo.toml 最小化重新生成 Cargo.lock，并验证一致性
          cargo --version || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
          cargo metadata --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 > /dev/null \
            || { echo "::error::Cargo.lock failed --locked verification"; exit 1; }

          git add Cargo.toml Cargo.lock
          git diff --cached --quiet || git commit --amend --no-edit

      - name: Generate release notes
        if: steps.detect.outputs.skip == 'false'
        run: |
          TAG="${{ steps.detect.outputs.up_tag }}"
          NOTES="docs/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            mkdir -p docs/release-notes
            git show "$TAG:$NOTES" > "$NOTES" 2>/dev/null || echo "Upstream release $TAG." > "$NOTES"
          fi
          cat docs/release-notes/loongarch-addon.md >> "$NOTES"
          # docker 镜像归本仓库命名空间
          sed -i "s|ghcr.io/vallierdev/|ghcr.io/${GITHUB_REPOSITORY_OWNER}/|g" "$NOTES"
          git add "$NOTES"
          git diff --cached --quiet || git commit --amend --no-edit

      - name: Push main and tag
        if: steps.detect.outputs.skip == 'false'
        run: |
          TAG="${{ steps.detect.outputs.up_tag }}"
          git push origin main
          # fetch upstream 时同名 tag 已在本地（指向上游提交），强制重打到我们的合并提交
          git tag -f "$TAG"
          git push -f origin "$TAG"

      # GITHUB_TOKEN 触发的 push/tag 事件不会触发其他 workflow（防递归），
      # 但 workflow_dispatch 是豁免事件 —— 直接 dispatch Release 构建新 tag。
      - name: Trigger Release for new tag
        if: steps.detect.outputs.skip == 'false'
        run: |
          TAG="${{ steps.detect.outputs.up_tag }}"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/dispatch-resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
              -d "{\"ref\":\"$TAG\"}")
            # 204 = accepted；tag 事件传播延迟时可能 422，重试等 tag 可见
            [ "$code" = "204" ] && { echo "Release dispatched on $TAG"; exit 0; }
            echo "attempt $i: HTTP $code, retrying in 15s"; sleep 15
          done
          echo "::error::failed to dispatch Release on $TAG (HTTP $code)"
          cat /tmp/dispatch-resp.json 2>/dev/null || true
          exit 1
